<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Luxury Slate -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Coin Drop Gradient: Golden Amber to Vivid Orange -->
    <linearGradient id="coinDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Inner Shadow & 3D bevel -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <radialGradient id="haloGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad3)" />
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="#312e81" stroke-width="2" stroke-opacity="0.5" />

  <!-- Ambient Light Behind Symbol -->
  <circle cx="256" cy="275" r="180" fill="url(#haloGlow)" />

  <!-- Main Geometric Fuel Drop + Coin Hybrid -->
  <g filter="url(#shadow3)">
    <!-- Base Drop Silhouette -->
    <path d="M 256 120 
             C 256 120, 160 250, 160 320 
             A 96 96 0 0 0 352 320 
             C 352 250, 256 120, 256 120 Z" 
          fill="url(#coinDrop)" />

    <!-- 3D Bevel Rim -->
    <path d="M 256 120 
             C 256 120, 160 250, 160 320 
             A 96 96 0 0 0 352 320 
             C 352 250, 256 120, 256 120 Z" 
          fill="url(#bevelGrad)" />

    <!-- Inner Coin Core (Circular inset with financial incision) -->
    <circle cx="256" cy="320" r="62" fill="#0f172a" opacity="0.9" />
    
    <!-- Gold Coin Rim -->
    <circle cx="256" cy="320" r="54" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.8" />

    <!-- Calculator / Currency Math Slash (Tiết kiệm nhiên liệu) -->
    <!-- Percent / Ratio & Calculator Symbol -->
    <path d="M 274 294 L 238 346" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" />
    <circle cx="240" cy="302" r="6" fill="#fbbf24" />
    <circle cx="272" cy="338" r="6" fill="#fbbf24" />

    <!-- Top Specular Gloss Highlight -->
    <path d="M 256 145 
             C 256 145, 185 240, 185 295 
             C 185 270, 235 180, 256 145 Z" 
          fill="#ffffff" 
          opacity="0.45" />
  </g>

  <!-- Clean Bottom Minimal Indicator: FuelMate Branding Dot -->
  <circle cx="256" cy="445" r="5" fill="#f59e0b" opacity="0.8" />
</svg>
